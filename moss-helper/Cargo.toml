[package]
name = "moss-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Isolated JSONL helper for the frozen transcribe.cpp MOSS runtime"

[dependencies]
libloading = "0.8"
memmap2 = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[dev-dependencies]
log = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
