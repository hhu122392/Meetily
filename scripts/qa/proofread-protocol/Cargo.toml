[package]
name = "meetily-proofread-protocol"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream"] }
